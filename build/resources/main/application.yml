spring:
  servlet:
    multipart:
      enabled: true                # multipart 사용 활성화 (기본값 true)
      max-file-size: 10MB         # 업로드 파일 하나의 최대 크기
      max-request-size: 20MB      # 요청 전체 크기 (파일 여러 개일 경우)
      location: /tmp              # 임시 저장 위치 (없으면 기본 temp 디렉토리 사용)
  datasource:
    url: jdbc:mysql://localhost:3308/mysql?useSSL=false&serverTimezone=Asia/Seoul
    username: root
    password: 1234
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: true
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Seoul

jwt:
  secret: u1H4BQ6R6W5rsmsI1k28JjcfpNH9EpS4kBgHQZNE92E=

server:
  port: 8888
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  pattern:
    console: "[%d{HH:mm:ss.SSS}][%-5level][%logger.%method:line%line] - %msg%n"
  level:
    org:
      hibernate:
        SQL: debug
        type.descriptor.sql: trace
