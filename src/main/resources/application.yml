spring:
  servlet:
    multipart:
      enabled: true                # multipart 사용 활성화 (기본값 true)
      max-file-size: 10MB         # 업로드 파일 하나의 최대 크기
      max-request-size: 20MB      # 요청 전체 크기 (파일 여러 개일 경우)
      location: /tmp              # 임시 저장 위치 (없으면 기본 temp 디렉토리 사용)
  datasource:
    url: jdbc:mysql://localhost:3308/mysql?useSSL=false&serverTimezone=Asia/Seoul
    username: root
    password: 1234
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Seoul

